name:                kirke
version:             0.1.0.0
github:              "black-belt-badger/kirke"
license:             BSD-3-Clause
license-file:        LICENSE
author:              "Marek Dudek"
maintainer:          "Marek Dudek"
copyright:           "2026 Marek Dudek"
synopsis:            Read-only Haskell CLI for Alpaca paper trading accounts
category:            Network
description:         |
  Unofficial Haskell command-line application for Alpaca's paper Trading API.
  Supports reading paper account information, open positions, available
  assets, and orders, either as summaries or complete JSON. Does not support live trading
  or order placement.
  See https://github.com/black-belt-badger/kirke for documentation.

extra-source-files:
- README.md
- CONTRIBUTING.md
- RELEASING.md
- SECURITY.md

extra-doc-files:
- CHANGELOG.md

dependencies:
  aeson: ">= 2.2 && < 2.3"
  base: ">= 4.7 && < 5"
  bytestring: ">= 0.12 && < 0.13"
  directory: ">= 1.3 && < 1.4"
  filepath: ">= 1.5 && < 1.6"
  http-client: ">= 0.7 && < 0.8"
  http-client-tls: ">= 0.3 && < 0.4"
  http-types: ">= 0.12 && < 0.13"
  optparse-applicative: ">= 0.18 && < 0.19"
  text: ">= 2.1 && < 2.2"

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  kirke:
    main:                Kirke.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kirke

tests:
  kirke-test:
    main:                Spec.hs
    source-dirs:         test
    build-tools:
    - hspec-discover:hspec-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kirke
    - "hspec >= 2.11 && < 2.12"
    - "unix >= 2.8 && < 2.9"
